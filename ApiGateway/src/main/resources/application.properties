
# API Gateway
spring.application.name=API-GATEWAY
server.port=8080

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Driver Service - Drivers Route
spring.cloud.gateway.server.webmvc.routes[0].id=DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/drivers/**

# Driver Service - Status Route
spring.cloud.gateway.server.webmvc.routes[1].id=DRIVER-STATUS
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/status

# Driver Service - Welcome Route
spring.cloud.gateway.server.webmvc.routes[2].id=DRIVER-WELCOME
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/welcome
